# Production stack for Dokploy.
#
# Same as docker-compose.prod.yml with the caddy service removed: Dokploy's Traefik terminates TLS
# and owns 80/443, so a second reverse proxy cannot bind them. Everything Caddy did for the two
# public hostnames — routing, HSTS and the other security headers, the API's own CSP, and hiding
# /metrics — is reproduced as Traefik labels on frontend and apigateway below.
#
# Deploy through Dokploy (Compose application). See docs/ops/dokploy.md.

name: eduplatform-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  authservice:
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_auth;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JWT__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL:?FRONTEND_URL is required}
      OTEL_SERVICE_NAME: authservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      Internal__UserServiceUrl: http://userservice:80
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__From: ${SMTP_FROM:-noreply@eduplatform.local}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      Email__RequireVerification: ${EMAIL_REQUIRE_VERIFICATION:-false}
      ConnectionStrings__RabbitMQ: ${RABBITMQ_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  userservice:
    build:
      context: .
      dockerfile: src/Services/UserService/UserService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_user;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      Internal__ApiKey: ${INTERNAL_API_KEY}
      Internal__AuthServiceUrl: http://authservice:80
      OTEL_SERVICE_NAME: userservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  classroomservice:
    build:
      context: .
      dockerfile: src/Services/ClassroomService/ClassroomService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_classroom;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      Jitsi__AppId: ${JITSI_APP_ID:-}
      Jitsi__AppSecret: ${JITSI_APP_SECRET:-}
      Subscription__BaseUrl: http://subscriptionservice:80
      Subscription__FailOpen: "true"
      OTEL_SERVICE_NAME: classroomservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      subscriptionservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  homeworkservice:
    build:
      context: .
      dockerfile: src/Services/HomeworkService/HomeworkService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_homework;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      Services__ClassroomService: http://classroomservice
      Subscription__BaseUrl: http://subscriptionservice:80
      Subscription__FailOpen: "true"
      OTEL_SERVICE_NAME: homeworkservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      classroomservice:
        condition: service_healthy
      subscriptionservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  examservice:
    build:
      context: .
      dockerfile: src/Services/ExamService/ExamService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_exam;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      Services__ClassroomService: http://classroomservice
      Subscription__BaseUrl: http://subscriptionservice:80
      Subscription__FailOpen: "true"
      OTEL_SERVICE_NAME: examservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      classroomservice:
        condition: service_healthy
      subscriptionservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  livesessionservice:
    build:
      context: .
      dockerfile: src/Services/LiveSessionService/LiveSessionService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      ConnectionStrings__Redis: redis:6379
      Services__ClassroomService: http://classroomservice
      Subscription__BaseUrl: http://subscriptionservice:80
      Subscription__FailOpen: "true"
      OTEL_SERVICE_NAME: livesessionservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      classroomservice:
        condition: service_healthy
      redis:
        condition: service_healthy
      subscriptionservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  notificationservice:
    build:
      context: .
      dockerfile: src/Services/NotificationService/NotificationService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_notification;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      OTEL_SERVICE_NAME: notificationservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  fileservice:
    build:
      context: .
      dockerfile: src/Services/FileService/FileService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_file;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      Services__ClassroomService: http://classroomservice
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD}
      MinIO__BucketName: ${MINIO_BUCKET:-eduplatform}
      MinIO__UseSsl: "false"
      Subscription__BaseUrl: http://subscriptionservice:80
      Subscription__FailOpen: "true"
      OTEL_SERVICE_NAME: fileservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      subscriptionservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  subscriptionservice:
    build:
      context: .
      dockerfile: src/Services/SubscriptionService/SubscriptionService/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=eduplatform_subscription;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      OTEL_SERVICE_NAME: subscriptionservice
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateway/ApiGateway/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-EduPlatform}
      JWT__Audience: ${JWT_AUDIENCE:-EduPlatformUsers}
      Frontend__Url: ${FRONTEND_URL}
      Api__PublicUrl: ${API_PUBLIC_URL:?API_PUBLIC_URL is required}
      OTEL_SERVICE_NAME: apigateway
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      authservice:
        condition: service_healthy
      userservice:
        condition: service_healthy
      classroomservice:
        condition: service_healthy
      homeworkservice:
        condition: service_healthy
      examservice:
        condition: service_healthy
      livesessionservice:
        condition: service_healthy
      notificationservice:
        condition: service_healthy
      fileservice:
        condition: service_healthy
      subscriptionservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.eduplatform-api.rule=Host(`${API_DOMAIN:?API_DOMAIN is required}`)
      - traefik.http.routers.eduplatform-api.entrypoints=websecure
      - traefik.http.routers.eduplatform-api.tls=true
      - traefik.http.routers.eduplatform-api.tls.certresolver=letsencrypt
      - traefik.http.routers.eduplatform-api.middlewares=eduplatform-api-sec@docker
      - traefik.http.services.eduplatform-api.loadbalancer.server.port=8080
      # The API returns data, never a document, so nothing it serves should be rendered or framed.
      - traefik.http.middlewares.eduplatform-api-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.eduplatform-api-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.eduplatform-api-sec.headers.stsPreload=true
      - traefik.http.middlewares.eduplatform-api-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.eduplatform-api-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.eduplatform-api-sec.headers.frameDeny=true
      - traefik.http.middlewares.eduplatform-api-sec.headers.contentSecurityPolicy=default-src 'none'; frame-ancestors 'none'
      - traefik.http.middlewares.eduplatform-api-sec.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-site
      # Metrics stay internal; Prometheus scrapes over the compose network, never the public host.
      # Traefik has no "return 404" middleware, so the edge answers 403 where Caddy answered 404.
      - traefik.http.routers.eduplatform-api-metrics.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/metrics`)
      - traefik.http.routers.eduplatform-api-metrics.entrypoints=websecure
      - traefik.http.routers.eduplatform-api-metrics.tls=true
      - traefik.http.routers.eduplatform-api-metrics.tls.certresolver=letsencrypt
      - traefik.http.routers.eduplatform-api-metrics.priority=100
      - traefik.http.routers.eduplatform-api-metrics.service=eduplatform-api
      - traefik.http.routers.eduplatform-api-metrics.middlewares=eduplatform-deny@docker
      - traefik.http.middlewares.eduplatform-deny.ipallowlist.sourcerange=127.0.0.1/32
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    restart: unless-stopped
    environment:
      # nginx substitutes these into Content-Security-Policy at container start.
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-https://${API_DOMAIN} wss://${API_DOMAIN}}
      CSP_FRAME_SRC: ${CSP_FRAME_SRC:-https://${VITE_JITSI_DOMAIN:-meet.jit.si}}
    depends_on:
      apigateway:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.eduplatform-app.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.eduplatform-app.entrypoints=websecure
      - traefik.http.routers.eduplatform-app.tls=true
      - traefik.http.routers.eduplatform-app.tls.certresolver=letsencrypt
      - traefik.http.routers.eduplatform-app.middlewares=eduplatform-sec@docker
      - traefik.http.services.eduplatform-app.loadbalancer.server.port=80
      # Caddy's shared security_headers snippet. HSTS belongs to whatever terminates TLS, which is
      # now Traefik, so it is set here rather than in the app.
      - traefik.http.middlewares.eduplatform-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.eduplatform-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.eduplatform-sec.headers.stsPreload=true
      - traefik.http.middlewares.eduplatform-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.eduplatform-sec.headers.referrerPolicy=strict-origin-when-cross-origin
    deploy:
      resources:
        limits:
          memory: 128M

  rabbitmq:
    profiles: ["messaging"]
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eduplatform}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eduplatform}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M

  otel-collector:
    profiles: ["obs"]
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    networks:
      - internal

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge
  # Created by Dokploy; Traefik only sees containers that are on it.
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

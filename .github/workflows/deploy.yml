name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME:-latest}"
          docker build -t "$PREFIX/apigateway:$TAG" -f src/ApiGateway/ApiGateway/Dockerfile .
          docker build -t "$PREFIX/authservice:$TAG" -f src/Services/AuthService/AuthService/Dockerfile .
          docker build -t "$PREFIX/userservice:$TAG" -f src/Services/UserService/UserService/Dockerfile .
          docker build -t "$PREFIX/classroomservice:$TAG" -f src/Services/ClassroomService/ClassroomService/Dockerfile .
          docker build -t "$PREFIX/homeworkservice:$TAG" -f src/Services/HomeworkService/HomeworkService/Dockerfile .
          docker build -t "$PREFIX/examservice:$TAG" -f src/Services/ExamService/ExamService/Dockerfile .
          docker build -t "$PREFIX/livesessionservice:$TAG" -f src/Services/LiveSessionService/LiveSessionService/Dockerfile .
          docker build -t "$PREFIX/notificationservice:$TAG" -f src/Services/NotificationService/NotificationService/Dockerfile .
          docker build -t "$PREFIX/fileservice:$TAG" -f src/Services/FileService/FileService/Dockerfile .
          docker build -t "$PREFIX/frontend:$TAG" --build-arg VITE_API_URL="${VITE_API_URL:-https://api.example.com}" -f frontend/Dockerfile frontend
          docker push --all-tags "$PREFIX/apigateway" || docker push "$PREFIX/apigateway:$TAG"
          for img in authservice userservice classroomservice homeworkservice examservice livesessionservice notificationservice fileservice frontend apigateway; do
            docker push "$PREFIX/$img:$TAG"
          done

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy hint
        run: |
          echo "Pull the tagged images on the VPS and run:"
          echo "  docker compose -f docker-compose.prod.yml --env-file .env up -d --no-deps --build"
          echo "Caddy health-checks upstreams; replace one service at a time for zero-downtime."

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EduPlatform.sln

      - name: Build
        run: dotnet build EduPlatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/EduPlatform.SmokeTests/EduPlatform.SmokeTests.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Gateway image
        run: docker build -f src/ApiGateway/ApiGateway/Dockerfile .

      - name: Build Frontend image
        run: docker build -f frontend/Dockerfile --build-arg VITE_API_URL=https://api.example.com ./frontend

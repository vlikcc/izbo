name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore EduPlatform.sln

      - name: Build
        run: dotnet build EduPlatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test EduPlatform.sln -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Vulnerable package scan
        run: bash scripts/check-vulnerable-packages.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches frontend/Dockerfile's build stage. Testing on one major and shipping a build
          # produced on another hides exactly the kind of difference that already bit us once: Node 26
          # ships an experimental localStorage global that shadows jsdom's, which broke every test
          # reading storage at import time until src/test/setup.ts installed a working Storage.
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Trivy covers the image and check-vulnerable-packages.sh covers NuGet; without this the
      # npm dependency tree is the one supply chain nothing looks at. Runtime deps only —
      # a build-time advisory does not ship to users and should not block a release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com

  # Every service that owns a DbContext, so a model that drifted from its migrations fails here
  # instead of at container start in production. LiveSessionService is stateless and has none.
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Auth
            project: src/Services/AuthService/AuthService
            database: eduplatform_auth
          - name: User
            project: src/Services/UserService/UserService
            database: eduplatform_user
          - name: Classroom
            project: src/Services/ClassroomService/ClassroomService
            database: eduplatform_classroom
          - name: Homework
            project: src/Services/HomeworkService/HomeworkService
            database: eduplatform_homework
          - name: Exam
            project: src/Services/ExamService/ExamService
            database: eduplatform_exam
          - name: Notification
            project: src/Services/NotificationService/NotificationService
            database: eduplatform_notification
          - name: File
            project: src/Services/FileService/FileService
            database: eduplatform_file
          - name: Subscription
            project: src/Services/SubscriptionService/SubscriptionService
            database: eduplatform_subscription
          - name: Content
            project: src/Services/ContentService/ContentService
            database: eduplatform_content
            context: ContentDbContext
          # YZ Kampüs: same database as Content, own context and migration history (__kampus_migrations).
          - name: Kampus
            project: src/Services/ContentService/ContentService
            database: eduplatform_content
            context: KampusDbContext
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore EduPlatform.sln
      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef --version 10.0.0
      - name: Validate ${{ matrix.name }} migrations
        run: |
          CONTEXT="${{ matrix.context }}"
          dotnet ef database update --project ${{ matrix.project }} ${CONTEXT:+--context $CONTEXT} --connection "Host=localhost;Database=${{ matrix.database }};Username=postgres"
          dotnet ef migrations has-pending-model-changes --project ${{ matrix.project }} ${CONTEXT:+--context $CONTEXT}

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apigateway
            file: src/ApiGateway/ApiGateway/Dockerfile
            context: .
          - name: authservice
            file: src/Services/AuthService/AuthService/Dockerfile
            context: .
          - name: userservice
            file: src/Services/UserService/UserService/Dockerfile
            context: .
          - name: classroomservice
            file: src/Services/ClassroomService/ClassroomService/Dockerfile
            context: .
          - name: homeworkservice
            file: src/Services/HomeworkService/HomeworkService/Dockerfile
            context: .
          - name: examservice
            file: src/Services/ExamService/ExamService/Dockerfile
            context: .
          - name: livesessionservice
            file: src/Services/LiveSessionService/LiveSessionService/Dockerfile
            context: .
          - name: notificationservice
            file: src/Services/NotificationService/NotificationService/Dockerfile
            context: .
          - name: fileservice
            file: src/Services/FileService/FileService/Dockerfile
            context: .
          - name: subscriptionservice
            file: src/Services/SubscriptionService/SubscriptionService/Dockerfile
            context: .
          - name: contentservice
            file: src/Services/ContentService/ContentService/Dockerfile
            context: .
          - name: frontend
            file: frontend/Dockerfile
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
          # Links the GHCR package to this (public) repository. The frontend takes its API address at
          # runtime (APP_API_URL → /config.js), so no domain is baked into any image.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Trivy scan
        # v0.36.0; pin the commit because pre-0.35 tags were hijacked in 2026.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      # main only, and only after the tests and the scan passed: the server pulls these instead of building.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (main, sha-<commit>)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SRC="${IMAGE_PREFIX}/${{ matrix.name }}:ci"
          for TAG in main "sha-${GITHUB_SHA::7}"; do
            docker tag "$SRC" "${IMAGE_PREFIX}/${{ matrix.name }}:${TAG}"
            docker push "${IMAGE_PREFIX}/${{ matrix.name }}:${TAG}"
          done

  publish:
    # Every image of this commit is on GHCR now; Dokploy only has to pull them. Dokploy's own
    # auto-deploy would start before the images exist, so the deploy is triggered from here instead.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    concurrency:
      group: dokploy-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_COMPOSE_ID" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::DOKPLOY_URL / DOKPLOY_COMPOSE_ID (variables) or DOKPLOY_API_KEY (secret) is not set; images are pushed but nothing was deployed."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 60 -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" -H "Content-Type: application/json" \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\"}"
          echo
          echo "Deploy queued for sha-${GITHUB_SHA::7}."

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript
      - name: Build
        run: |
          dotnet restore EduPlatform.sln
          dotnet build EduPlatform.sln -c Release --no-restore
      - uses: github/codeql-action/analyze@v3
